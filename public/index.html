<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BJJ Pódio · Ranking de jiu-jitsu do Paraná</title>
  <meta name="description" content="Ranking anual dos campeonatos de jiu-jitsu do Paraná. Pontos, pódios e quem lidera a temporada.">
  <meta name="theme-color" content="#0b0d10">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="BJJ Pódio">
  <meta property="og:title" content="BJJ Pódio · Ranking de jiu-jitsu do Paraná">
  <meta property="og:description" content="Ranking anual dos campeonatos de jiu-jitsu do Paraná. Pontos, pódios e quem lidera a temporada.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/assets/js/paginas/inicio.js"></script>
</head>
<body data-page="ranking">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="site-header"></div>

  <main id="conteudo">
    <section class="hero">
      <div class="container">
        <p class="hero__eyebrow">Temporada <span data-temporada>2026</span></p>
        <h1 class="hero__title">BJJ Pódio</h1>
        <p class="hero__slogan">Cada luta conta.</p>
        <dl class="hero__meta" id="hero-meta" hidden></dl>
      </div>
    </section>

    <form class="container section filtros" id="filtros" aria-label="Filtrar ranking por categoria">
      <div id="filtros-campos" class="filtros__campos"></div>
      <button type="button" class="botao-link" id="limpar-filtros" hidden>Limpar filtros</button>
    </form>

    <p class="container estado" id="estado" role="status">Carregando ranking…</p>

    <section class="container section podio" aria-labelledby="titulo-podio">
      <h2 id="titulo-podio">Quem lidera <span class="titulo-categoria" id="podio-categoria"></span></h2>
      <div id="podio"></div>
    </section>

    <section class="container section" aria-labelledby="titulo-ranking">
      <div class="ranking-topo">
        <div>
          <h2 id="titulo-ranking">Ranking</h2>
          <p class="text-mute ranking-resumo" id="ranking-resumo" aria-live="polite"></p>
        </div>
        <label class="busca">
          <span class="visually-hidden">Buscar atleta pelo nome</span>
          <svg class="busca__icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="busca" form="filtros" placeholder="Buscar atleta" autocomplete="off" enterkeyhint="search">
        </label>
      </div>

      <div class="ranking-cab" id="ranking-cab" aria-hidden="true">
        <span>#</span><span>Atleta</span>
        <span class="ranking-cab__medalha">Ouro</span><span class="ranking-cab__medalha">Prata</span><span class="ranking-cab__medalha">Bronze</span>
        <span>Etapas</span><span>Pontos</span>
      </div>
      <ol class="ranking" id="ranking" aria-labelledby="titulo-ranking"></ol>
      <div class="ranking-vazio card placeholder" id="ranking-vazio" hidden>
        <strong>Nenhum atleta encontrado</strong>
        <p></p>
      </div>

      <p class="ranking-nota text-mute" id="ranking-nota"></p>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
